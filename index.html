<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Sleigh Explorer</title>
    <style>
        .collapsible {
            cursor: pointer;
            padding: 10px;
            border: 1px solid #ccc;
            margin: 5px 0;
        }
        .content {
            display: none;
            padding: 10px;
            border-left: 1px solid #ccc;
            margin-left: 20px;
        }
        #event-view {
            min-height: 50px;
            resize: vertical;
            overflow: scroll;
            height: 350px;
        }
        .no-bullets {
            list-style-type: none;
        }
    </style>
  </head>
  <body>
    <h3>Bytes</h3>
    <div id="hex-view"></div>
    <h3>Context</h3>
	<div class="container">
		<button id="prev">Prev</button>
		<button id="next">Next</button>
	</div>
    <h3>Event</h3>
    <div id="event-view"></div>
    <h3>Instructions</h3>
    <div id="list-container"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
