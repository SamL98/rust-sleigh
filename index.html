<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Sleigh Explorer</title>
    <style>
        .collapsible {
            cursor: pointer;
            padding: 10px;
            border: 1px solid #ccc;
            margin: 5px 0;
        }
        .content {
            display: none;
            padding: 10px;
            border-left: 1px solid #ccc;
            margin-left: 20px;
        }
    </style>
  </head>
  <body>
    <h3>Bytes</h3>
    <div id="hex-view"></div>
    <h3>Context</h3>
    <div id="context-view"></div>
	<div class="container">
		<button id="prev">Prev</button>
		<button id="next">Next</button>
	</div>
    <h3>Event</h3>
    <div id="event-view"></div>
    <h3>Instructions</h3>
    <div id="list-container"></div>
    <script type="module">
      import init, { 
        disassemble, bytes, context, disassemble_one, resolver_debug,
        get_context, get_addr, get_offset
      } from "./pkg/sleigh.js";
      init().then(() => {
        let fileBytes = bytes();
        let ctx = context();
        let sleighCtx = get_context(ctx);
        let origPc = get_addr(ctx);
        let off = get_offset(ctx);

        const hexView = document.getElementById('hex-view');
        let byteStrings = [];

        // Cannot map because it converts to Uint8Array.
        fileBytes.forEach((n, i) => { 
            let s = n.toString(16).padStart(2, '0');
            byteStrings.push('<span id=byte' + i + '>' + s + '</span>');
        });
        hexView.innerHTML = byteStrings.join(' ');

        function setColor(color) {
            for (let i = 0; i < 4; i++) {
                let o = off + i;
                if (o < fileBytes.length)
                    document.getElementById('byte' + i).style = 'color: ' + color;
            }
        }

        function getWord() {
            let word = 0;
            for (let i = 0; i < 4; i++) {
                let o = off + i;
                if (o < fileBytes.length)
                    word = (word << 8) | fileBytes[o];
            }
            return word;
        }

        setColor('red');

        const ctxView = document.getElementById('context-view');
        byteStrings = [];

        // Cannot map because it converts to Uint8Array.
        sleighCtx.forEach(n => { byteStrings.push(n.toString(16).padStart(8, '0')) });
        ctxView.textContent = byteStrings.join(' ');

        let resolverState = resolver_debug();
        let insns = [disassemble_one(ctx, fileBytes, BigInt(0x100003f20), resolverState)];

        const wordView = document.getElementById('event-view');
        let events = resolverState['events'];

        function displayEvent(ev) {
            let kind = ev['kind'];

            if (kind == 0) {
                let startBit = ev['start'];
                let endBit = ev['end'];
                let word = getWord();
                let hexStr = word.toString(16).padStart(8, '0');
                let binStr = word.toString(2).padStart(32, '0').split('').map((b, i) => {
                    let color = 'black';
                    if (i >= startBit && i < endBit)
                        color = 'red';
                    return '<span style="color: ' + color + '">' + b + '</span>';
                }).join('');
                wordView.innerHTML = ev['table'] + '    ' + hexStr + '    ' + binStr;
            }
            else if (kind == 1) {
                wordView.innerHTML = 'Matched ' + ev['matched_constructor'];
            }
            else if (kind == 2) {
                wordView.innerHTML = 'Operand'
            }
        };

        let eventIdx = 0;
        displayEvent(events[eventIdx]);

        document.getElementById('next').addEventListener('click', () => {
            eventIdx = Math.min(eventIdx + 1, events.length - 1);
            displayEvent(events[eventIdx]);
        });

        document.getElementById('prev').addEventListener('click', () => {
            eventIdx = Math.max(eventIdx - 1, 0);
            displayEvent(events[eventIdx]);
        });

        //let insns = disassemble();
        const container = document.getElementById('list-container');

        insns.forEach((insn) => {
            const collapsible = document.createElement('div');
            collapsible.className = 'collapsible';
            collapsible.textContent = insn['address'].to_string() + ' ' + insn['asm'];
            container.appendChild(collapsible);

            insn['ops'].forEach((op) => {
                const content = document.createElement('div');
                content.className = 'content';
                content.textContent = '  ' + op.to_string();

                collapsible.addEventListener('click', () => {
                    content.style.display = content.style.display === 'block' ? 'none' : 'block';
                });

                container.appendChild(content);
            });
        });
      });
    </script>
  </body>
</html>
