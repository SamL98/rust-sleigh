[package]
name = "sleigh"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "sleigh"
path = "src/lib.rs"

[[bin]]
name = "sleigh"
path = "src/main.rs"

[dependencies]
nom = "6.0"
bitvec = "1"
glob = "0.3.1"
elementtree = "1.2.3"
lazy_static = "1.4.0"

# [target.'cfg(target_arch = "wasm32")'.dependencies]

[dependencies.web-sys]
version = "0.3"
features = ['Headers', 'Request', 'RequestInit', 'RequestMode', 'Response', 'Window', 'HtmlElement', 'Document', 'Element', 'DomTokenList', 'CssStyleDeclaration']
# path = "../../crates/web-sys"
